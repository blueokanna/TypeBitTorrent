# Standalone Compose stack — works on 飞牛 fnOS (Docker app), Unraid's
# Compose Manager, and any plain Docker host.
#
#   cd packaging/docker
#   TYPEBIT_PASSWORD='change-me' docker compose up -d
#
# The same container is what the Unraid template (packaging/unraid) and the
# fnOS package (packaging/fnos) deploy; nothing here is specific to one NAS.
services:
  typebittorrent:
    image: ghcr.io/blueokanna/typebittorrent:latest
    # To build locally instead of pulling:
    # build:
    #   context: ../..
    #   dockerfile: packaging/docker/Dockerfile
    container_name: typebittorrent
    restart: unless-stopped
    environment:
      # WebUI credentials — mandatory: the server refuses to start an
      # unauthenticated remote interface and generates a one-off password
      # (printed to the log) when this is unset.
      TYPEBIT_PASSWORD: "${TYPEBIT_PASSWORD:?set TYPEBIT_PASSWORD}"
      TYPEBIT_USERNAME: "${TYPEBIT_USERNAME:-admin}"
      TYPEBIT_PORT: "18881"
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
    ports:
      - "18881:18881"      # WebUI
      - "6881:6881/tcp"  # peer connections (inbound)
      - "6881:6881/udp"  # DHT / uTP / LSD
    volumes:
      - "${TYPEBIT_DATA:-./config}:/config"        # settings, resume data, receipts
      - "${TYPEBIT_DOWNLOADS:-./downloads}:/downloads"
    # The engine writes into /downloads and /config only — a read-only root
    # filesystem is fine and recommended where supported.
    security_opt:
      - no-new-privileges:true
