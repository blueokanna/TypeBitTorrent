org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.parallel=true

kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2048m
# We define an explicit jvmShared source set for the shared JNI actuals, so
# the default KMP hierarchy template does not apply.
kotlin.mpp.applyDefaultHierarchyTemplate=false
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# Compose Multiplatform
org.jetbrains.compose.experimental.uikit.enabled=false

# Keep resource names stable for desktop packaging
compose.desktop.packaging.useNativeDistTasks=false
