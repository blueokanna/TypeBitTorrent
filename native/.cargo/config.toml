# Cross-compilation for Android (NDK toolchain direct, no cargo-ndk needed).
#
# NOTE: Cargo does not expand `${VAR}` inside `linker`/`ar` values, so this
# file is (re)generated by scripts/build-android.ps1 with the concrete NDK
# path resolved from ANDROID_NDK_HOME. If you change the NDK version, either
# re-run the script or update the paths below.
#
# Android NDK 26.2.11394342 — linker lives in
# $NDK/toolchains/llvm/prebuilt/windows-x86_64/bin.

[target.aarch64-linux-android]
linker = "C:/Users/blueo/AppData/Local/Android/Sdk/ndk/26.2.11394342/toolchains/llvm/prebuilt/windows-x86_64/bin/aarch64-linux-android24-clang.cmd"
ar = "C:/Users/blueo/AppData/Local/Android/Sdk/ndk/26.2.11394342/toolchains/llvm/prebuilt/windows-x86_64/bin/llvm-ar"

[target.armv7-linux-androideabi]
linker = "C:/Users/blueo/AppData/Local/Android/Sdk/ndk/26.2.11394342/toolchains/llvm/prebuilt/windows-x86_64/bin/armv7a-linux-androideabi24-clang.cmd"
ar = "C:/Users/blueo/AppData/Local/Android/Sdk/ndk/26.2.11394342/toolchains/llvm/prebuilt/windows-x86_64/bin/llvm-ar"

[target.x86_64-linux-android]
linker = "C:/Users/blueo/AppData/Local/Android/Sdk/ndk/26.2.11394342/toolchains/llvm/prebuilt/windows-x86_64/bin/x86_64-linux-android24-clang.cmd"
ar = "C:/Users/blueo/AppData/Local/Android/Sdk/ndk/26.2.11394342/toolchains/llvm/prebuilt/windows-x86_64/bin/llvm-ar"

[target.i686-linux-android]
linker = "C:/Users/blueo/AppData/Local/Android/Sdk/ndk/26.2.11394342/toolchains/llvm/prebuilt/windows-x86_64/bin/i686-linux-android24-clang.cmd"
ar = "C:/Users/blueo/AppData/Local/Android/Sdk/ndk/26.2.11394342/toolchains/llvm/prebuilt/windows-x86_64/bin/llvm-ar"

[target.x86_64-pc-windows-msvc]
