name: Build TypeBitTorrent

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the version in gradle.properties from main
        type: boolean
        default: false

concurrency:
  group: build-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  prepare:
    name: Determine release version
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: version
        env:
          BEFORE: ${{ github.event.before }}
          MANUAL_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          read_version() { sed -n 's/^typebit\.version=//p' | tr -d '\r'; }
          version=$(read_version < gradle.properties)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo '::error::Invalid typebit.version in gradle.properties'; exit 1; }
          tag="v$version"
          publish=false
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF_TYPE" == tag ]]; then
            [[ "$GITHUB_REF_NAME" == "$tag" ]] || { echo "::error::The release tag must match $tag"; exit 1; }
            publish=true
          elif [[ "$MANUAL_PUBLISH" == true ]]; then
            [[ "$GITHUB_REF" == refs/heads/main ]] || { echo '::error::Select main to publish this version'; exit 1; }
            publish=true
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main && ! "$BEFORE" =~ ^0+$ ]]; then
            if ! git cat-file -e "$BEFORE^{commit}"; then git fetch --no-tags origin "$BEFORE"; fi
            previous=''
            if git cat-file -e "$BEFORE:gradle.properties" 2>/dev/null; then
              previous=$(git show "$BEFORE:gradle.properties" | read_version)
            fi
            if [[ "$version" != "$previous" ]]; then publish=true; fi
          fi
          if [[ "$publish" == true ]] && git show-ref --verify --quiet "refs/tags/$tag"; then
            if [[ $(git rev-parse "refs/tags/$tag^{commit}") != "$(git rev-parse HEAD)" ]]; then
              echo "::error::$tag already belongs to another commit. Increase typebit.version for a new release."
              exit 1
            fi
          fi
          printf 'tag=%s\npublish=%s\n' "$tag" "$publish" >> "$GITHUB_OUTPUT"
          if [[ "$publish" == true ]]; then
            echo "Publish **$tag** after both builds pass." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Build artifacts only. To publish from main, bump typebit.version or select **Publish** in Run workflow." >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: Build APK + Windows distribution
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      # ---------------------------------------------------------------- checkouts
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # ------------------------------------------------------------------ toolchain
      - name: Set up JDK 17
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (caching)
        uses: gradle/actions/setup-gradle@v6.4.1

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools

      - name: Install NDK and Android build tools
        shell: pwsh
        run: |
          sdkmanager --install 'ndk;28.2.13676358' 'platforms;android-37.1' 'build-tools;37.0.0'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "ANDROID_NDK_HOME=$env:ANDROID_HOME/ndk/28.2.13676358" >> $env:GITHUB_ENV

      - name: Set up Rust (with Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            aarch64-linux-android,
            armv7-linux-androideabi,
            x86_64-linux-android,
            i686-linux-android

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: native

      - name: Build Windows desktop native DLL
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/build-desktop.ps1

      - name: Build Android native libs (4 ABIs)
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/build-android.ps1 -NativeOnly

      - name: Verify the native bridge matches Kotlin
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/verify-native.ps1

      - name: Run native bridge tests
        shell: pwsh
        working-directory: native
        run: cargo test --locked

      - name: Lint native bridge (clippy, warnings are errors)
        shell: pwsh
        working-directory: native
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test desktop and shared code
        run: .\gradlew.bat :composeApp:desktopTest --console=plain

      # ------------------------------------------------------------------ Android APK
      - name: Build Android APK (debug)
        if: needs.prepare.outputs.publish != 'true'
        shell: pwsh
        run: .\gradlew.bat :composeApp:assembleDebug --console=plain

      - name: Build release APK
        if: needs.prepare.outputs.publish == 'true'
        run: .\gradlew.bat :composeApp:assembleRelease --console=plain

      - name: Sign and verify the release APK
        if: needs.prepare.outputs.publish == 'true'
        shell: pwsh
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          $key = Join-Path $env:RUNNER_TEMP 'typebit-release.keystore'
          $tools = "$env:ANDROID_HOME/build-tools/37.0.0"
          try {
            [IO.File]::WriteAllBytes($key, [Convert]::FromBase64String($env:KEYSTORE_B64))
            $apk = 'composeApp/build/outputs/apk/release/composeApp-release-unsigned.apk'
            & "$tools/apksigner.bat" sign --ks $key --ks-key-alias $env:KEY_ALIAS --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD --out TypeBitTorrent-android.apk $apk
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            & "$tools/apksigner.bat" verify --verbose TypeBitTorrent-android.apk
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            & "$tools/zipalign.exe" -c -P 16 4 TypeBitTorrent-android.apk
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          } finally { Remove-Item -Force $key -ErrorAction SilentlyContinue }

      # ------------------------------------------------------------------ Windows desktop
      - name: Build Windows portable distribution
        shell: pwsh
        run: .\gradlew.bat :composeApp:createDistributable --console=plain

      - name: Build Windows installers (EXE/MSI)
        shell: pwsh
        run: .\gradlew.bat :composeApp:packageExe :composeApp:packageMsi --console=plain

      - name: Verify a download with the packaged Windows client
        run: python scripts/test-packaged-download.py composeApp/build/compose/binaries/main/app/TypeBitTorrent/TypeBitTorrent.exe

      # ------------------------------------------------------------------ artifacts
      - name: Package Windows portable zip
        shell: pwsh
        run: |
          $src = "composeApp/build/compose/binaries/main/app/TypeBitTorrent"
          if (-not (Test-Path $src)) { throw "portable distribution missing: $src" }
          Compress-Archive -Path $src -DestinationPath "TypeBitTorrent-windows-portable.zip"

      - name: Upload Android APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: TypeBitTorrent-Android-APK
          path: ${{ needs.prepare.outputs.publish == 'true' && 'TypeBitTorrent-android.apk' || 'composeApp/build/outputs/apk/debug/composeApp-debug.apk' }}
          if-no-files-found: error

      - name: Upload Windows portable
        uses: actions/upload-artifact@v7.0.2
        with:
          name: TypeBitTorrent-Windows-Portable
          path: TypeBitTorrent-windows-portable.zip
          if-no-files-found: error

      - name: Upload Windows installers
        uses: actions/upload-artifact@v7.0.2
        with:
          name: TypeBitTorrent-Windows-Installers
          path: |
            composeApp/build/compose/binaries/main/exe/*.exe
            composeApp/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error

  nas:
    name: Build Linux app image (fnOS / Unraid / Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (caching)
        uses: gradle/actions/setup-gradle@v6.4.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2.9.3
        with:
          workspaces: native

      - name: Install packaging prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils fakeroot libxi6 libxrender1 libxtst6 libxext6 \
            libfreetype6 fontconfig

      - name: Build Linux app image
        run: |
          chmod +x scripts/build-linux.sh
          scripts/build-linux.sh

      - name: Verify a download with the packaged Linux client
        run: python3 scripts/test-packaged-download.py composeApp/build/compose/binaries/main/app/TypeBitTorrent/bin/TypeBitTorrent

      - name: Upload Linux app image
        uses: actions/upload-artifact@v7.0.2
        with:
          name: TypeBitTorrent-Linux
          path: build-TypeBitTorrent-linux-*.tar.gz
          if-no-files-found: error

      - name: Build Docker image (no push)
        run: |
          docker build -f packaging/docker/Dockerfile -t typebittorrent:ci .

  release:
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, build, nas]
    concurrency: release-${{ needs.prepare.outputs.tag }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          path: artifacts
      - name: Publish verified packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          version=${TAG#v}
          mkdir release
          cp artifacts/TypeBitTorrent-Android-APK/TypeBitTorrent-android.apk release/
          cp artifacts/TypeBitTorrent-Windows-Portable/*.zip release/
          cp artifacts/TypeBitTorrent-Windows-Installers/exe/*.exe release/
          cp artifacts/TypeBitTorrent-Windows-Installers/msi/*.msi release/
          cp artifacts/TypeBitTorrent-Linux/*.tar.gz release/
          (cd release && sha256sum * > SHA256SUMS)
          remote_tag=$(git ls-remote origin "refs/tags/$TAG")
          if [[ -z "$remote_tag" ]]; then
            git push origin "HEAD:refs/tags/$TAG"
          else
            git fetch --no-tags origin "refs/tags/$TAG"
            if [[ $(git rev-parse 'FETCH_HEAD^{commit}') != "$(git rev-parse HEAD)" ]]; then
              echo "::error::$TAG already belongs to another commit. Increase typebit.version for a new release."
              exit 1
            fi
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [[ $(gh release view "$TAG" --json isDraft --jq .isDraft) == false ]]; then
              gh release view "$TAG" --json assets --jq '.assets[].name' | sort > published-files
              missing=$(comm -23 <(cd release && printf '%s\n' * | sort) published-files)
              if [[ -n "$missing" ]]; then
                printf 'Published release %s is missing assets:\n%s\n' "$TAG" "$missing" >&2
                exit 1
              fi
              echo "Release $TAG already contains all packages." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          else
            gh release create "$TAG" --verify-tag --draft --generate-notes --title "TypeBitTorrent $version"
          fi
          gh release upload "$TAG" release/* --clobber
          gh release edit "$TAG" --draft=false
          gh release view "$TAG" --json url --jq '.url' >> "$GITHUB_STEP_SUMMARY"
