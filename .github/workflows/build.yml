name: Build TypeBitTorrent

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK + Windows distribution
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      # ---------------------------------------------------------------- checkouts
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------------ toolchain
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install NDK 26.2.11394342
        shell: pwsh
        run: |
          echo "y" | sdkmanager --install "ndk;26.2.11394342"
          if (-not (Test-Path "$env:ANDROID_HOME/ndk/26.2.11394342")) {
            throw "NDK not found under $env:ANDROID_HOME/ndk/26.2.11394342"
          }

      - name: Set up Rust (with Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: >-
            aarch64-linux-android,
            armv7-linux-androideabi,
            x86_64-linux-android,
            i686-linux-android

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Build Windows desktop native DLL
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/build-desktop.ps1

      - name: Build Android native libs (4 ABIs)
        shell: pwsh
        run: |
          $env:ANDROID_NDK_HOME = "$env:ANDROID_HOME/ndk/26.2.11394342"
          if (-not (Test-Path $env:ANDROID_NDK_HOME)) {
            throw "ANDROID_NDK_HOME missing: $env:ANDROID_NDK_HOME"
          }
          powershell -ExecutionPolicy Bypass -File scripts/build-android.ps1

      - name: Verify the native bridge matches Kotlin
        shell: pwsh
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.2.11394342
        run: powershell -ExecutionPolicy Bypass -File scripts/verify-native.ps1

      - name: Run native bridge tests
        shell: pwsh
        working-directory: native
        run: cargo test

      - name: Lint native bridge (clippy, warnings are errors)
        shell: pwsh
        working-directory: native
        run: cargo clippy --all-targets -- -D warnings

      # ------------------------------------------------------------------ Android APK
      - name: Build Android APK (debug)
        shell: pwsh
        run: .\gradlew.bat :composeApp:assembleDebug --console=plain

      # ------------------------------------------------------------------ Windows desktop
      - name: Build Windows portable distribution
        shell: pwsh
        run: .\gradlew.bat :composeApp:createDistributable --console=plain

      # Installers (EXE/MSI) are best-effort: they download WiX and use
      # jpackage, which can be flaky on hosted runners. The portable
      # distribution above is the guaranteed Windows deliverable.
      - name: Build Windows installers (EXE/MSI)
        shell: pwsh
        continue-on-error: true
        run: .\gradlew.bat :composeApp:packageDistributionForCurrentOS --console=plain

      # ------------------------------------------------------------------ artifacts
      - name: Package Windows portable zip
        shell: pwsh
        run: |
          $src = "composeApp/build/compose/binaries/main/app/TypeBitTorrent"
          if (-not (Test-Path $src)) { throw "portable distribution missing: $src" }
          Compress-Archive -Path $src -DestinationPath "TypeBitTorrent-windows-portable.zip"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: TypeBitTorrent-Android-APK
          path: composeApp/build/outputs/apk/debug/composeApp-debug.apk
          if-no-files-found: error

      - name: Upload Windows portable
        uses: actions/upload-artifact@v4
        with:
          name: TypeBitTorrent-Windows-Portable
          path: TypeBitTorrent-windows-portable.zip
          if-no-files-found: error

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: TypeBitTorrent-Windows-Installers
          path: |
            composeApp/build/compose/binaries/main/exe/*.exe
            composeApp/build/compose/binaries/main/msi/*.msi
          if-no-files-found: warn

  nas:
    name: Build Linux app image (fnOS / Unraid / Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Install packaging prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils fakeroot libxi6 libxrender1 libxtst6 libxext6 \
            libfreetype6 fontconfig

      - name: Build Linux app image
        run: |
          chmod +x scripts/build-linux.sh
          scripts/build-linux.sh

      - name: Smoke-test the headless server
        run: |
          set -Eeuo pipefail
          OUT="$GITHUB_WORKSPACE/composeApp/build/compose/binaries/main/app/TypeBitTorrent"
          LOG=/tmp/typebit.log
          STATE=/tmp/state.json
          DATA_DIR="$(mktemp -d)"
          DOWNLOADS_DIR="$(mktemp -d)"
          "$OUT/bin/TypeBitTorrent" --headless --bind=127.0.0.1 --port=18080 \
            --data="$DATA_DIR" --downloads="$DOWNLOADS_DIR" \
            --password="ci-smoke-password" > /tmp/typebit.log 2>&1 &
          PID=$!
          cleanup() {
            status=$?
            if [ -n "${PID:-}" ]; then
              kill "$PID" 2>/dev/null || true
              wait "$PID" 2>/dev/null || true
            fi
            if [ "$status" -ne 0 ]; then
              echo "::error::Headless smoke test failed; application output follows:"
              if [ -f "$LOG" ]; then cat "$LOG"; else echo "Application log was not created."; fi
            fi
          }
          trap cleanup EXIT

          READY=0
          for i in $(seq 1 60); do
            if curl --silent --fail --connect-timeout 1 --max-time 2 \
              http://127.0.0.1:18080/api/session >/dev/null; then
              READY=1
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "::error::Headless process exited before the WebUI became ready."
              exit 1
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "::error::WebUI did not become ready within 60 seconds."
            exit 1
          fi
          curl -fsS http://127.0.0.1:18080/api/state > "$STATE"
          curl -fsS http://127.0.0.1:18080/ > /dev/null
          python3 - <<'PY'
          import json
          with open("/tmp/state.json") as fh:
              state = json.load(fh)
          print("engine running:", state.get("engineRunning"))
          assert state.get("engineRunning") is True, "engine did not start"
          PY
          kill "$PID"
          wait "$PID" || true
          PID=""
          cat "$LOG"

      - name: Upload Linux app image
        uses: actions/upload-artifact@v4
        with:
          name: TypeBitTorrent-Linux
          path: build-TypeBitTorrent-linux-*.tar.gz
          if-no-files-found: error

      - name: Build Docker image (no push)
        run: |
          docker build -f packaging/docker/Dockerfile -t typebittorrent:ci .
